services:
  - type: worker
    name: rural-health-ai-agent
    env: python
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python src/agent.py start"
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GLADIA_API_KEY
        sync: false
      - key: MOSS_PROJECT_ID
        sync: false
      - key: MOSS_PROJECT_KEY
        sync: false
